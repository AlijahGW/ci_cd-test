<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevSecOps Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: auto; }
        .vuln-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .high { border-left: 5px solid #ff4444; }
        .medium { border-left: 5px solid #ffbb33; }
    </style>
</head>
<body>
    <h1>Security Vulnerability Report</h1>
    <div style="width: 300px; margin-bottom: 30px;">
        <canvas id="vulnChart"></canvas>
    </div>
    
    <input type="text" id="searchBar" placeholder="Filter by source or severity..." style="width: 100%; padding: 10px; margin-bottom: 20px;">
    <div id="vulnList"></div>

    <script>
        let allVulns = [];

        fetch('unified_report.json')
            .then(response => response.json())
            .then(data => {
                allVulns = data.findings;
                
                // Render Chart
                new Chart(document.getElementById('vulnChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['SAST', 'DAST'],
                        datasets: [{
                            data: [data.sast_count, data.dast_count],
                            backgroundColor: ['#36A2EB', '#FF6384']
                        }]
                    }
                });

                renderList(allVulns);
            });

        function renderList(vulns) {
            const container = document.getElementById('vulnList');
            container.innerHTML = vulns.map(v => `
                <div class="vuln-card ${v.severity.toLowerCase()}">
                    <h3>${v.vulnerability} <small>(${v.severity})</small></h3>
                    <p><strong>Source:</strong> ${v.source}</p>
                    <p><strong>Location:</strong> ${v.location}</p>
                    <p>${v.description}</p>
                </div>
            `).join('');
        }

        document.getElementById('searchBar').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allVulns.filter(v => 
                v.vulnerability.toLowerCase().includes(term) || 
                v.source.toLowerCase().includes(term) ||
                v.severity.toLowerCase().includes(term)
            );
            renderList(filtered);
        });
    </script>
</body>
</html>
