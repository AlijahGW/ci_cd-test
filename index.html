<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevSecOps Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: auto; }
        .vuln-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .critical { border-left: 5px solid #cc0000; }
        .high { border-left: 5px solid #ff4444; }
        .medium { border-left: 5px solid #ffbb33; }
        .low { border-left: 5px solid #00C851; }
        .charts-container { display: flex; gap: 40px; margin-bottom: 30px; justify-content: center; }
        .chart-wrapper { width: 300px; }
    </style>
</head>
<body>
    <h1>Security Vulnerability Report</h1>
    
    <div class="charts-container">
        <div class="chart-wrapper">
            <canvas id="sourceChart"></canvas>
        </div>
        <div class="chart-wrapper">
            <canvas id="severityChart"></canvas>
        </div>
    </div>
    
    <input type="text" id="searchBar" placeholder="Filter by source or severity..." style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">
    <div id="vulnList"></div>

    <script>
        let allVulns = [];

        fetch('unified_report.json')
            .then(response => response.json())
            .then(data => {
                allVulns = data.findings;
                
                // Source Doughnut Chart
                new Chart(document.getElementById('sourceChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['SAST', 'DAST'],
                        datasets: [{
                            data: [data.sast_count, data.dast_count],
                            backgroundColor: ['#36A2EB', '#FF6384']
                        }]
                    }
                });

                // Tally Severities
                let counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
                allVulns.forEach(v => {
                    if (counts[v.severity] !== undefined) counts[v.severity]++;
                });

                // Severity Pie Chart
                new Chart(document.getElementById('severityChart'), {
                    type: 'pie',
                    data: {
                        labels: ['Low', 'Medium', 'High', 'Critical'],
                        datasets: [{
                            data: [counts.LOW, counts.MEDIUM, counts.HIGH, counts.CRITICAL],
                            backgroundColor: ['#00C851', '#ffbb33', '#ff4444', '#cc0000']
                        }]
                    },
                    options: {
                        onClick: (event, elements, chart) => {
                            if (elements.length > 0) {
                                // Extract the label of the clicked slice
                                const clickedIndex = elements[0].index;
                                const selectedSeverity = chart.data.labels[clickedIndex];
                                
                                // Auto-fill the search bar to show the active filter
                                document.getElementById('searchBar').value = selectedSeverity;
                                
                                // Filter and render the list
                                const filtered = allVulns.filter(v => v.severity.toLowerCase() === selectedSeverity.toLowerCase());
                                renderList(filtered);
                            }
                        },
                        // Change cursor to pointer on hover
                        onHover: (event, chartElement) => {
                            event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
                        }
                    }
                });

                renderList(allVulns);
            });

        function renderList(vulns) {
            const container = document.getElementById('vulnList');
            container.innerHTML = vulns.map(v => `
                <div class="vuln-card ${v.severity.toLowerCase()}">
                    <h3>${v.vulnerability} <small>(${v.severity})</small></h3>
                    <p><strong>Source:</strong> ${v.source}</p>
                    <p><strong>Location:</strong> ${v.location}</p>
                    <p>${v.description}</p>
                </div>
            `).join('');
        }

        // Standard search bar listener for manual typing
        document.getElementById('searchBar').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allVulns.filter(v => 
                v.vulnerability.toLowerCase().includes(term) || 
                v.source.toLowerCase().includes(term) ||
                v.severity.toLowerCase().includes(term)
            );
            renderList(filtered);
        });
    </script>
</body>
</html>
