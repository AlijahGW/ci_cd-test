<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevSecOps Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: auto; }
        .vuln-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .critical { border-left: 5px solid #cc0000; }
        .high { border-left: 5px solid #ff4444; }
        .medium { border-left: 5px solid #ffbb33; }
        .low { border-left: 5px solid #00C851; }
        .charts-container { display: flex; gap: 40px; margin-bottom: 30px; justify-content: center; }
        .chart-wrapper { width: 300px; }
        .ai-content pre {
        background-color: #2d2d2d;
        color: #f8f8f2;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
        }
        .ai-content code {
            background-color: #e9ecef;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .ai-content pre code {
            background-color: transparent; 
            padding: 0;
        }
    </style>
</head>
<body>
    <h1>Security Vulnerability Report</h1>
    
    <div class="charts-container">
        <div class="chart-wrapper">
            <canvas id="sourceChart"></canvas>
        </div>
        <div class="chart-wrapper">
            <canvas id="severityChart"></canvas>
        </div>
    </div>
    
    <input type="text" id="searchBar" placeholder="Filter by source or severity..." style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">
    <div id="vulnList"></div>

    <script>
        let allVulns = [];
        let sourceChart;
        let severityChart;

        // Global state to track active filters
        let activeSourceFilter = "";
        let activeSeverityFilter = "";
        let activeTextFilter = "";

        fetch('unified_report.json')
            .then(response => response.json())
            .then(data => {
                allVulns = data.findings;
                
                // Initialize Source Chart
                sourceChart = new Chart(document.getElementById('sourceChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['SAST', 'DAST'],
                        datasets: [{ data: [0, 0], backgroundColor: ['#36A2EB', '#FF6384'] }]
                    },
                    options: {
                        onClick: (event, elements, chart) => {
                            if (elements.length > 0) {
                                const clicked = chart.data.labels[elements[0].index];
                                // Toggle filter on or off
                                activeSourceFilter = activeSourceFilter === clicked ? "" : clicked;
                                updateDashboard();
                            }
                        },
                        onHover: (e, el) => e.native.target.style.cursor = el[0] ? 'pointer' : 'default'
                    }
                });

                // Initialize Severity Chart
                severityChart = new Chart(document.getElementById('severityChart'), {
                    type: 'pie',
                    data: {
                        labels: ['Low', 'Medium', 'High', 'Critical'],
                        datasets: [{ data: [0, 0, 0, 0], backgroundColor: ['#00C851', '#ffbb33', '#ff4444', '#cc0000'] }]
                    },
                    options: {
                        onClick: (event, elements, chart) => {
                            if (elements.length > 0) {
                                const clicked = chart.data.labels[elements[0].index].toUpperCase();
                                // Toggle filter on or off
                                activeSeverityFilter = activeSeverityFilter === clicked ? "" : clicked;
                                updateDashboard();
                            }
                        },
                        onHover: (e, el) => e.native.target.style.cursor = el[0] ? 'pointer' : 'default'
                    }
                });

                updateDashboard(); // Initial render
            });

        function updateDashboard() {
            // 1. Filter the vulnerability list based on all active states
            const filtered = allVulns.filter(v => {
                const matchText = activeTextFilter === "" || 
                    v.vulnerability.toLowerCase().includes(activeTextFilter) || 
                    v.source.toLowerCase().includes(activeTextFilter) ||
                    v.severity.toLowerCase().includes(activeTextFilter);
                
                const matchSource = activeSourceFilter === "" || v.source.includes(activeSourceFilter);
                const matchSeverity = activeSeverityFilter === "" || v.severity === activeSeverityFilter;

                return matchText && matchSource && matchSeverity;
            });

            renderList(filtered);

            // 2. Dynamically update the Source Chart proportions
            sourceChart.data.datasets[0].data = [
                filtered.filter(v => v.source.includes('SAST')).length,
                filtered.filter(v => v.source.includes('DAST')).length
            ];
            sourceChart.update();

            // 3. Dynamically update the Severity Chart proportions
            let counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
            filtered.forEach(v => { if (counts[v.severity] !== undefined) counts[v.severity]++; });
            severityChart.data.datasets[0].data = [counts.LOW, counts.MEDIUM, counts.HIGH, counts.CRITICAL];
            severityChart.update();
        }

        function renderList(vulns) {
            const container = document.getElementById('vulnList');
            container.innerHTML = vulns.map(v => `
                <div class="vuln-card ${v.severity.toLowerCase()}">
                    <h3>${v.vulnerability} <small>(${v.severity})</small></h3>
                    <p><strong>Source:</strong> ${v.source}</p>
                    <p><strong>Location:</strong> ${v.location}</p>
                    <p>${v.description}</p>
                    ${v.ai_analysis ? `
                    <div style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-left: 4px solid #8a2be2;">
                        <strong>🤖 AI Analysis & Remediation:</strong>
                        <div class="ai-content" style="margin-top: 10px;">
                            ${marked.parse(v.ai_analysis)}
                        </div>
                    </div>` : ''}
                </div>
            `).join('');
        }

        // Search bar updates text filter independently of chart clicks
        document.getElementById('searchBar').addEventListener('keyup', (e) => {
            activeTextFilter = e.target.value.toLowerCase();
            updateDashboard();
        });
    </script>
</body>
</html>
