name: Automated DevSecOps

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: 

permissions:
  issues: write
  contents: write

jobs:
  sast_scan:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install and Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config "p/default" --json -o semgrep.json

      - name: Upload SAST Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

  dast_scan:
    name: Dynamic Analysis (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast_scan
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Juice Shop Container
        run: |
          docker run --rm -d -p 3000:3000 bkimminich/juice-shop
          echo "Waiting for Juice Shop to boot..."
          sleep 15

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          issue_title: 'ZAP Scan Report'
          fail_action: false

      -name: Download SAST Artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
        
      - name: Run Unified Parser
        run: |
        mv report_json.json zap.json  
        python parse_reports.py

      - name: Prepare Pages Directory
        run: |
          mkdir public
          cp index.html public/
          cp unified_report.json public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public